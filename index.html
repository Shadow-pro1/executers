<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shadow | Delta</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b0c10;
            color: #c5c6c7;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(31, 147, 255, 0.15) 0%, rgba(0,0,0,0) 70%);
            top: -100px;
            z-index: 0;
        }

        .header {
            width: 100%;
            max-width: 800px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 50px;
            z-index: 10;
        }

        .logo {
            font-size: 2.2rem;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: linear-gradient(45deg, #ffffff, #1f93ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(31, 147, 255, 0.3);
        }

        .discord-btn {
            background: #5865F2;
            color: #ffffff;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(88, 101, 242, 0.3);
        }

        .discord-btn:hover {
            background: #4752c4;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(88, 101, 242, 0.5);
        }

        .main-container {
            width: 100%;
            max-width: 500px;
            background: linear-gradient(145deg, #1f283305, #151a21);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 24px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            z-index: 10;
            margin-top: 20px;
            position: relative;
        }

        .main-container::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            border-radius: 24px;
            border: 1px solid transparent;
            background: linear-gradient(145deg, rgba(31, 147, 255, 0.2), transparent) border-box;
            -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: destination-out;
            mask-composite: exclude;
            pointer-events: none;
        }

        .app-icon {
            width: 110px;
            height: 110px;
            border-radius: 22px;
            object-fit: cover;
            margin-top: -95px;
            margin-bottom: 25px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6), 0 0 20px rgba(31, 147, 255, 0.2);
            border: 2px solid #1f93ff;
            background-color: #1a1a1a;
        }

        .app-title {
            font-size: 1.8rem;
            color: #ffffff;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .app-subtitle {
            font-size: 0.95rem;
            color: #6674cc;
            margin-bottom: 30px;
            font-weight: 500;
        }

        .features-box {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 35px;
            text-align: right;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        .features-title {
            font-size: 1rem;
            color: #ffffff;
            margin-bottom: 12px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .features-title::before {
            content: '✦';
            color: #1f93ff;
        }

        .features-list {
            list-style: none;
            font-size: 0.9rem;
            color: #8f9499;
            line-height: 1.8;
        }

        .features-list li {
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .features-list li::before {
            content: '•';
            color: #1f93ff;
            font-weight: bold;
        }

        .download-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            background: linear-gradient(90deg, #0076ff, #1f93ff);
            color: #ffffff;
            text-decoration: none;
            padding: 16px 32px;
            border-radius: 14px;
            font-size: 1.1rem;
            font-weight: 700;
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(31, 147, 255, 0.3);
            border: none;
            cursor: pointer;
        }

        .download-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(31, 147, 255, 0.5);
            background: linear-gradient(90deg, #1f93ff, #0076ff);
        }

        .download-btn:active {
            transform: translateY(-1px);
        }

        .footer-note {
            font-size: 0.75rem;
            color: #4f5d73;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <header class="header">
        <div class="logo">SHADOW</div>
        <a href="https://discord.gg/TSTaVmRhS" class="discord-btn" target="_blank">
            <svg width="20" height="20" viewBox="0 0 127.14 96.36" fill="currentColor">
                <path d="M107.7,8.07A105.15,105.15,0,0,0,77.26,0a77.19,77.19,0,0,0-3.3,6.83A96.67,96.67,0,0,0,53.22,6.83,77.19,77.19,0,0,0,49.88,0,105.15,105.15,0,0,0,19.44,8.07C3.66,31.58-1.86,54.65,1,77.53A105.73,105.73,0,0,0,32,96.36a74.37,74.37,0,0,0,6.73-10.93,68.6,68.6,0,0,1-10.64-5.12c.91-.67,1.81-1.37,2.65-2.1a75.22,75.22,0,0,0,72.68,0c.84.73,1.74,1.43,2.65,2.1a68.42,68.42,0,0,1-10.64,5.12,74.74,74.74,0,0,0,6.73,10.93,105.54,105.54,0,0,0,31.05-18.83C129.91,50.7,124.12,27.83,107.7,8.07ZM42.45,65.69C36.18,65.69,31,60,31,53S36.18,40.36,42.45,40.36,53.88,46,53.79,53,48.72,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.24,60,73.24,53S78.41,40.36,84.69,40.36,96.12,46,96,53,91,65.69,84.69,65.69Z"/>
            </svg>
            سيرفر الديسكورد
        </a>
    </header>

    <main class="main-container">
        <img src="https://deltaios-executor.com/Icon.jpg" alt="Delta Icon" class="app-icon">
        
        <h1 class="app-title">Delta | Executor</h1>
        <p class="app-subtitle"> سيرفر killer</p>

        <div class="features-box">
            <div class="features-title">مميزات هاك دلتا:</div>
            <ul class="features-list">
                <li>اشهر واكثر هاك مستقر</li>
                <li>مفتاح سهل</li>
                <li>يشغل اغلب السكربتات</li>
                
            </ul>
        </div>

        <a href="itms-services://?action=download-manifest&url=https://raw.githubusercontent.com/Shadow-pro1/delta/main/manifest.plist" class="download-btn">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v4"></path>
                <polyline points="7 10 12 15 17 10"></polyline>
                <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
            تحميل هاك Delta
        </a>

        <div class="footer-note">delta executor</div>
    </main>

</body>
</html>
